<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Notas | Exercício 10</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Tema Dark -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark-theme text-light">

    <!-- NAVBAR (Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar border-bottom border-secondary border-opacity-25 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="../index.html">
                <span>&larr; Voltar aos Projetos</span>
            </a>
            <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 px-3 py-2 rounded-pill">
                Exercício 10
            </span>
        </div>
    </nav>

    <!-- CONTAINER (Bootstrap) -->
    <div class="container my-5">
        <div class="grades-wrapper">

            <!-- CABEÇALHO -->
            <div class="text-center mb-4">
                <span class="fs-1 mb-2 d-inline-block">📊</span>
                <h1 class="display-6 fw-bold text-white mb-1">Sistema de Gestão de Notas</h1>
                <p class="text-secondary small">Cadastre notas de estudantes, acompanhe médias e analise o desempenho da turma</p>
            </div>

            <!-- CARDS DE ESTATÍSTICAS (Bootstrap Grid) -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="stat-box p-3 rounded-4">
                        <span class="stat-label">Total Alunos</span>
                        <span class="stat-value text-white" id="statTotal">0</span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-box p-3 rounded-4">
                        <span class="stat-label">Média da Turma</span>
                        <span class="stat-value text-white" id="statMedia">0.0</span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-box p-3 rounded-4">
                        <span class="stat-label">Aprovados</span>
                        <span class="stat-value text-success" id="statAprovados">0</span>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-box p-3 rounded-4">
                        <span class="stat-label">Recuperação / Repr.</span>
                        <span class="stat-value text-warning" id="statAtencao">0</span>
                    </div>
                </div>
            </div>

            <!-- FORMULÁRIO (Card Bootstrap) -->
            <div class="card card-dark p-4 mb-4">
                <h5 class="fw-bold text-white mb-3">Adicionar Aluno</h5>
                
                <!-- ALERT (Bootstrap) -->
                <div id="alertaNotas" class="alert d-none text-center fw-bold border-0" role="alert"></div>

                <form id="formAluno">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label for="nome" class="form-label text-secondary small fw-bold">Nome do Estudante</label>
                            <input type="text" id="nome" class="form-control form-control-dark py-2" placeholder="Ex: Samuel Borges" required>
                        </div>
                        <div class="col-md-2">
                            <label for="nota1" class="form-label text-secondary small fw-bold">Nota 1 (0 a 10)</label>
                            <input type="number" id="nota1" class="form-control form-control-dark py-2" placeholder="Ex: 8.5" min="0" max="10" step="0.1" required>
                        </div>
                        <div class="col-md-2">
                            <label for="nota2" class="form-label text-secondary small fw-bold">Nota 2 (0 a 10)</label>
                            <input type="number" id="nota2" class="form-control form-control-dark py-2" placeholder="Ex: 9.0" min="0" max="10" step="0.1" required>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                                Adicionar +
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- TABELA (Card e Table Bootstrap) -->
            <div class="card card-dark p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold text-white mb-0">Relação de Alunos</h5>
                    <button class="btn btn-link text-secondary text-decoration-none p-0 small" onclick="limparTodos()">
                        Limpar Lista
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-dark-custom align-middle text-center mb-0">
                        <thead>
                            <tr>
                                <th class="text-start ps-3">Estudante</th>
                                <th>Nota 1</th>
                                <th>Nota 2</th>
                                <th>Média Final</th>
                                <th>Situação</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaAlunos">
                            <!-- Inserido pelo JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
