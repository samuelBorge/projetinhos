<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculadora">

        <h1>Calculadora</h1>

        <!-- Primeiro número -->
        <input
            type="number"
            id="numero1"
            placeholder="Primeiro número"
        >

        <!-- Escolha da operação -->
        <select id="operacao">

            <option value="+">
                Soma
            </option>

            <option value="-">
                Subtração
            </option>

            <option value="*">
                Multiplicação
            </option>

            <option value="/">
                Divisão
            </option>

        </select>

        <!-- Segundo número -->
        <input
            type="number"
            id="numero2"
            placeholder="Segundo número"
        >

        <!--
            Quando clicar:
            execute a função calcular()
        -->
        <button onclick="calcular()">
            Calcular
        </button>

        <!-- Resultado -->
        <h2 id="resultado">
            Resultado: 0
        </h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
