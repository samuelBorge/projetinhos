<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora | Exercício 3</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Tema Dark -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark-theme text-light">

    <!-- NAVBAR (Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar border-bottom border-secondary border-opacity-25 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="../index.html">
                <span>&larr; Voltar aos Projetos</span>
            </a>
            <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 px-3 py-2 rounded-pill">
                Exercício 3
            </span>
        </div>
    </nav>

    <!-- CONTAINER (Bootstrap) -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-sm-8">

                <!-- CARD (Bootstrap) -->
                <div class="card shadow-lg p-4 card-dark">
                    
                    <div class="text-center mb-4">
                        <span class="fs-1 mb-2 d-inline-block">🧮</span>
                        <h2 class="fw-bold text-white mb-1">Calculadora</h2>
                        <p class="text-secondary small">Realize operações matemáticas simples</p>
                    </div>

                    <!-- Primeiro número -->
                    <div class="mb-3">
                        <label for="numero1" class="form-label text-secondary small fw-bold">Primeiro número</label>
                        <input type="number" id="numero1" class="form-control form-control-dark py-2" placeholder="Digite um valor..." step="any">
                    </div>

                    <!-- Operação -->
                    <div class="mb-3">
                        <label for="operacao" class="form-label text-secondary small fw-bold">Operação</label>
                        <select id="operacao" class="form-select form-control-dark py-2">
                            <option value="+">Soma (+)</option>
                            <option value="-">Subtração (-)</option>
                            <option value="*">Multiplicação (&times;)</option>
                            <option value="/">Divisão (&divide;)</option>
                        </select>
                    </div>

                    <!-- Segundo número -->
                    <div class="mb-3">
                        <label for="numero2" class="form-label text-secondary small fw-bold">Segundo número</label>
                        <input type="number" id="numero2" class="form-control form-control-dark py-2" placeholder="Digite outro valor..." step="any">
                    </div>

                    <!-- BOTÃO CALCULAR (Bootstrap) -->
                    <button type="button" id="btnCalcular" class="btn btn-primary w-100 py-2 fw-bold mt-2">
                        Calcular Resultado
                    </button>

                    <!-- RESULTADO (Alert Bootstrap) -->
                    <div id="resultadoBox" class="alert alert-info text-center mt-4 mb-0 fw-bold fs-5 border border-info border-opacity-25 bg-info bg-opacity-10 text-info">
                        Resultado: 0
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
