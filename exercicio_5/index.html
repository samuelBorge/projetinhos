<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Página Responsiva</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <h1>Meu Site</h1>
    </header>


    <!-- Menu -->
    <nav>

        <a href="#">Início</a>

        <a href="#">Sobre</a>

        <a href="#">Serviços</a>

        <a href="#">Contato</a>

    </nav>


    <!-- Conteúdo principal -->
    <main>

        <!-- Seção principal -->
        <section>

            <h2>Conteúdo principal</h2>

            <p>
                Esta é a área principal da página.
                O conteúdo se adapta automaticamente
                para diferentes tamanhos de tela.
            </p>

        </section>


        <!-- Barra lateral -->
        <aside>

            <h2>Barra lateral</h2>

            <p>
                Informações adicionais podem aparecer aqui.
            </p>

        </aside>

    </main>


    <!-- Rodapé -->
    <footer>

        <p>© 2026 - Meu Site</p>

    </footer>

</body>
</html>
