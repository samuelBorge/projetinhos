<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens | Exercício 6</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Tema Dark -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark-theme text-light">

    <!-- NAVBAR (Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar border-bottom border-secondary border-opacity-25 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="../index.html">
                <span>&larr; Voltar aos Projetos</span>
            </a>
            <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 px-3 py-2 rounded-pill">
                Exercício 6
            </span>
        </div>
    </nav>

    <!-- CONTAINER (Bootstrap) -->
    <div class="container my-5">
        <div class="text-center mb-5">
            <span class="fs-1 mb-2 d-inline-block">🖼️</span>
            <h1 class="display-6 fw-bold text-white mb-2">Galeria Visual</h1>
            <p class="text-secondary mx-auto" style="max-width: 550px;">
                Clique em qualquer fotografia para abrir o visualizador em tela cheia com Modal do Bootstrap.
            </p>
        </div>

        <!-- GRID DE IMAGENS (Bootstrap Grid & Cards) -->
        <div class="row g-4" id="gridGaleria">
            <!-- Inserido pelo JavaScript -->
        </div>
    </div>

    <!-- MODAL (Bootstrap Modal) -->
    <div class="modal fade" id="modalGaleria" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg text-center">
            <div class="modal-content card-dark p-3 border border-secondary border-opacity-25">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-white" id="tituloImagemModal">Visualização</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <img src="" id="imagemModal" class="img-fluid rounded-4 shadow-lg border border-primary border-opacity-50" alt="Foto Ampliada">
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
