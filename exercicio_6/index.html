<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Galeria</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Minha Galeria</h1>

    <!-- Galeria -->
    <div class="galeria">

        <!--
            Cada imagem chama abrirModal()
            quando for clicada.
        -->

        <img
            src="https://picsum.photos/500/400?random=1"
            onclick="abrirModal(this)"
        >

        <img
            src="https://picsum.photos/500/400?random=2"
            onclick="abrirModal(this)"
        >

        <img
            src="https://picsum.photos/500/400?random=3"
            onclick="abrirModal(this)"
        >

        <img
            src="https://picsum.photos/500/400?random=4"
            onclick="abrirModal(this)"
        >

        <img
            src="https://picsum.photos/500/400?random=5"
            onclick="abrirModal(this)"
        >

        <img
            src="https://picsum.photos/500/400?random=6"
            onclick="abrirModal(this)"
        >

    </div>


    <!-- Modal -->

    <div id="modal"
         class="modal"
         onclick="fecharModal()">

        <!-- X para fechar -->
        <span>&times;</span>

        <!-- Imagem ampliada -->
        <img id="imagemModal">

    </div>


    <script src="script.js"></script>

</body>
</html>
