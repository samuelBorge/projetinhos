<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz">

        <h1>Quiz de Informática</h1>

        <!-- Pergunta será colocada aqui -->
        <div id="pergunta"></div>

        <!-- Respostas serão criadas pelo JS -->
        <div id="respostas"></div>

        <!-- Botão para avançar -->
        <button id="proximo"
                onclick="proximaPergunta()">
            Próxima
        </button>

        <!-- Resultado final -->
        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
