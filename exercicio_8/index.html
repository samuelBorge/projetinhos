<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Informática | Exercício 8</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Tema Dark -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark-theme text-light">

    <!-- NAVBAR (Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar border-bottom border-secondary border-opacity-25 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="../index.html">
                <span>&larr; Voltar aos Projetos</span>
            </a>
            <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 px-3 py-2 rounded-pill">
                Exercício 8
            </span>
        </div>
    </nav>

    <!-- CONTAINER (Bootstrap) -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-sm-10">

                <!-- CARD (Bootstrap) -->
                <div class="card shadow-lg p-4 card-dark">
                    <div class="text-center mb-4">
                        <span class="fs-1 mb-2 d-inline-block">🧠</span>
                        <h2 class="fw-bold text-white mb-1">Quiz de Tecnologia</h2>
                        <p class="text-secondary small">Teste seus conhecimentos em HTML, CSS e JavaScript</p>
                    </div>

                    <!-- PERGUNTA -->
                    <h5 id="pergunta" class="fw-bold mb-3 text-white">Carregando pergunta...</h5>

                    <!-- RESPOSTAS (Botões criados pelo JavaScript) -->
                    <div id="respostas" class="d-grid gap-2 mb-3"></div>

                    <!-- MENSAGEM DE FEEDBACK (Alert Bootstrap) -->
                    <div id="feedbackAlert" class="alert d-none text-center fw-bold border-0" role="alert"></div>

                    <!-- BOTÃO AVANÇAR (Bootstrap) -->
                    <button id="btnProximo" class="btn btn-primary w-100 py-2 fw-bold" disabled>
                        Próxima Pergunta &rarr;
                    </button>

                    <!-- RESULTADO FINAL -->
                    <div id="resultadoFinal" class="alert alert-success border border-success border-opacity-25 bg-success bg-opacity-10 text-success text-center mt-3 d-none fw-bold fs-5" role="alert"></div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
