<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Exercício 2</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Tema Dark -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark-theme text-light">

    <!-- NAVBAR (Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar border-bottom border-secondary border-opacity-25 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="../index.html">
                <span>&larr; Voltar aos Projetos</span>
            </a>
            <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 px-3 py-2 rounded-pill">
                Exercício 2
            </span>
        </div>
    </nav>

    <!-- CONTAINER (Bootstrap) -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <!-- CARD (Bootstrap) -->
                <div class="card shadow-lg p-4 card-dark">
                    
                    <div class="text-center mb-4">
                        <span class="fs-1 mb-2 d-inline-block">📝</span>
                        <h2 class="fw-bold text-white mb-1">Criar Conta</h2>
                        <p class="text-secondary small">Preencha os campos para validar e cadastrar o usuário</p>
                    </div>

                    <!-- ALERT (Bootstrap) -->
                    <div id="mensagemAlerta" class="alert d-none" role="alert"></div>

                    <!-- FORMULÁRIO -->
                    <form id="formCadastro">

                        <!-- Nome -->
                        <div class="mb-3">
                            <label for="nome" class="form-label text-secondary small fw-bold">Nome completo</label>
                            <input type="text" id="nome" class="form-control form-control-dark py-2" placeholder="Ex: Samuel Borges" required>
                        </div>

                        <!-- E-mail -->
                        <div class="mb-3">
                            <label for="email" class="form-label text-secondary small fw-bold">E-mail</label>
                            <input type="email" id="email" class="form-control form-control-dark py-2" placeholder="seuemail@exemplo.com" required>
                        </div>

                        <!-- Telefone -->
                        <div class="mb-3">
                            <label for="telefone" class="form-label text-secondary small fw-bold">Telefone</label>
                            <input type="tel" id="telefone" class="form-control form-control-dark py-2" placeholder="(00) 00000-0000" required>
                        </div>

                        <!-- Senha -->
                        <div class="mb-3">
                            <label for="senha" class="form-label text-secondary small fw-bold">Senha</label>
                            <input type="password" id="senha" class="form-control form-control-dark py-2" placeholder="Mínimo 6 caracteres" required>
                        </div>

                        <!-- Confirmação de Senha -->
                        <div class="mb-4">
                            <label for="confirmarSenha" class="form-label text-secondary small fw-bold">Confirme a senha</label>
                            <input type="password" id="confirmarSenha" class="form-control form-control-dark py-2" placeholder="Repita a mesma senha" required>
                        </div>

                        <!-- BOTÃO (Bootstrap) -->
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                            Finalizar Cadastro &rarr;
                        </button>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
