<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lista de Tarefas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Lista de Tarefas</h1>

        <div class="entrada">

            <!-- Campo onde o usuário digita -->
            <input
                type="text"
                id="tarefa"
                placeholder="Digite uma tarefa"
            >

            <!-- Chama adicionarTarefa() -->
            <button onclick="adicionarTarefa()">
                Adicionar
            </button>

        </div>

        <!--
            A lista começa vazia.
            O JavaScript vai criar os <li>.
        -->
        <ul id="lista"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
