<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas | Exercício 4</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Tema Dark -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark-theme text-light">

    <!-- NAVBAR (Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar border-bottom border-secondary border-opacity-25 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="../index.html">
                <span>&larr; Voltar aos Projetos</span>
            </a>
            <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 px-3 py-2 rounded-pill">
                Exercício 4
            </span>
        </div>
    </nav>

    <!-- CONTAINER (Bootstrap) -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-sm-10">

                <!-- CARD (Bootstrap) -->
                <div class="card shadow-lg p-4 card-dark">
                    
                    <div class="text-center mb-4">
                        <span class="fs-1 mb-2 d-inline-block">✅</span>
                        <h2 class="fw-bold text-white mb-1">Minhas Tarefas</h2>
                        <p class="text-secondary small">Organize sua rotina de estudos e projetos</p>
                    </div>

                    <!-- ENTRADA DE TAREFA (Input-Group Form-Control e Button) -->
                    <div class="input-group mb-4">
                        <input type="text" id="tarefaInput" class="form-control form-control-dark py-2" placeholder="Qual é a sua próxima tarefa?" autocomplete="off">
                        <button class="btn btn-primary fw-bold px-3" id="btnAdicionar" type="button">
                            Adicionar +
                        </button>
                    </div>

                    <!-- MENSAGEM QUANDO VAZIO -->
                    <div id="alertaVazio" class="alert alert-secondary bg-white bg-opacity-10 border-0 text-center d-none" role="alert">
                        Nenhuma tarefa cadastrada no momento.
                    </div>

                    <!-- LISTA DE TAREFAS (List-Group) -->
                    <ul class="list-group" id="lista"></ul>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
