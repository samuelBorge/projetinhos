<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários da API | Exercício 9</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Tema Dark -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark-theme text-light">

    <!-- NAVBAR (Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar border-bottom border-secondary border-opacity-25 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="../index.html">
                <span>&larr; Voltar aos Projetos</span>
            </a>
            <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25 px-3 py-2 rounded-pill">
                Exercício 9
            </span>
        </div>
    </nav>

    <!-- CONTAINER (Bootstrap) -->
    <div class="container my-5">
        <div class="text-center mb-5">
            <span class="fs-1 mb-2 d-inline-block">🌐</span>
            <h1 class="display-6 fw-bold text-white mb-2">Lista de Usuários da API</h1>
            <p class="text-secondary mx-auto" style="max-width: 550px;">
                Consumo assíncrono de dados com Fetch API e exibição em Cards responsivos do Bootstrap.
            </p>
            
            <!-- Botão de recarregar -->
            <button id="btnRecarregar" class="btn btn-primary fw-bold btn-sm px-4 py-2 rounded-pill">
                🔄 Recarregar Dados
            </button>
        </div>

        <!-- MENSAGEM DE STATUS (Alert Bootstrap) -->
        <div id="mensagemStatus" class="alert alert-info border border-info border-opacity-25 bg-info bg-opacity-10 text-info text-center" role="alert">
            Carregando usuários da API...
        </div>

        <!-- GRID DE CARDS DOS USUÁRIOS (Bootstrap Grid) -->
        <div class="row g-4" id="usuariosGrid"></div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
