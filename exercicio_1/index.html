<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Página de apresentação pessoal de Samuel Borges. Interesses em ADS no IFRO, tecnologia e hobbies."
    >

    <title>Samuel Borges | Apresentação Pessoal</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="apresentação.css">
</head>

<body>

    <!-- CONTAINER PRINCIPAL -->
    <main class="container">

        <!-- FOTO DE PERFIL -->
        <div
            class="profile-wrapper"
            id="profileTrigger"
            title="Clique para ampliar"
        >

            <img
                src="profile.png"
                alt="Foto de perfil de Samuel Borges"
                class="profile-img"
            >

        </div>


        <!-- NOME -->
        <h1>Samuel Borges</h1>


        <!-- BADGE -->
        <span class="badge">
            Futuro Desenvolvedor
        </span>


        <!-- SOBRE MIM -->
        <section class="section">

            <h2 class="section-title">
                Sobre Mim & Interesses
            </h2>

            <p class="interests-text">
                Meus interesses são terminar o ensino médio,
                fazer o ADS no IFRO e trabalhar na área de TI.
            </p>

        </section>


        <!-- HOBBIES -->
        <section class="section">

            <h2 class="section-title">
                Meus Hobbies
            </h2>

            <ul class="hobbies-list">

                <li>
                    <span class="hobby-icon">🎮</span>
                    Jogar
                </li>

                <li>
                    <span class="hobby-icon"> 📚</span>
                    Estudar
                </li>

                <li>
                    <span class="hobby-icon">🍳</span>
                    Cozinhar
                </li>

            </ul>

        </section>


        <!-- BOTÃO DO GITHUB -->
        <a
            href="https://github.com/samuelBorge"
            target="_blank"
            rel="noopener noreferrer"
            class="social-link"
        >

            <!-- ÍCONE DO GITHUB -->
            <svg
                class="github-icon"
                viewBox="0 0 24 24"
            >

                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>

            </svg>

            GitHub / samuelBorge

        </a>

    </main>


    <!-- =========================================
         MODAL DA FOTO
    ========================================== -->

    <div
        class="modal"
        id="photoModal"
    >

        <!-- BOTÃO FECHAR -->
        <span
            class="close-modal"
            id="closeBtn"
        >
            &times;
        </span>


        <!-- FOTO AMPLIADA -->
        <img
            class="modal-content"
            src="profile.png"
            alt="Zoom Foto de Perfil"
        >


        <!-- NOME -->
        <p class="modal-caption">
            Samuel Borges
        </p>

    </div>


    <!-- Arquivo JavaScript -->
    <script src="script_apresentação.js"></script>

</body>

</html>
